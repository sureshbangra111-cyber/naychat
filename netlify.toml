# Frontend build only. The Express API and MongoDB are deployed separately —
# see DEPLOYMENT.md. This repo no longer ships a static-only backend.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback so /chat/:id deep links survive a hard refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
